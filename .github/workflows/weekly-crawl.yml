name: Weekly Crawl

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NLMA_BMLIC_API_URL: ${{ vars.NLMA_BMLIC_API_URL }}
          GCIS_COMPANY_LOOKUP_ENABLED: ${{ vars.GCIS_COMPANY_LOOKUP_ENABLED }}
          GCIS_COMPANY_KEYWORD_API_URL: ${{ vars.GCIS_COMPANY_KEYWORD_API_URL }}
          GCIS_COMPANY_DETAILS_API_URL: ${{ vars.GCIS_COMPANY_DETAILS_API_URL }}
          PERMIT_START_DATE: ${{ vars.PERMIT_START_DATE }}
          PERMIT_END_DATE: ${{ vars.PERMIT_END_DATE }}
          MIN_CONSTRUCTION_COST: ${{ vars.MIN_CONSTRUCTION_COST }}
          MAX_PROJECTS: ${{ vars.MAX_PROJECTS }}
          TARGET_USAGES: ${{ vars.TARGET_USAGES }}
          RESULTS_PATH: results/results.json
          REPORT_PATH: results/report.html
        run: python -m src.main

      - name: Upload crawler results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-crawl-results
          path: results/
          if-no-files-found: error
